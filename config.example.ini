[settings]
; These settings are used if you run the script without input parameter

; model family, the architecture to use
; options: clip | siglip | t5
architecture = t5

; action mode, what operation to run, log to console, save as text-file, sort files
; options: log | text | sort
mode = sort

; log output order, how to sort the log console printing, by file or by sorted output
; options: input | category
log_order = input

; result destination, saves where the input file is or to an /output folder
; options: input | output
result_location = input

; sorting operation, when using sort mode
; options: copy | move
sort_operation = move

; top matches, how many categories to save in text mode
; options: integer >= 1
top_k = 1



[categories]
; Left is the printed/output folder category name.
; Right is one vector-search label used by the matching.
man = man
woman = woman
environment = landscape
environment = environment
house = house
cartoon = cartoon
manga = manga
object = object
food = food
animal = animal
