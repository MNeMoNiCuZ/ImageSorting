[settings]
; architecture: clip | siglip | t5
architecture = t5
; mode: console | text | sort
mode = console
; console_order (used when mode=console): input | category
console_order = input
; result_location (used when mode=text or mode=sort): input | copy_to_output | move_to_output
result_location = input
; number of top matches to compute/print
top_k = 3


[categories]
; Left is the printed/output folder category name.
; Right is one vector-search label used by the matching.
man = man
woman = woman
environment = landscape
environment = environment
house = house
cartoon = cartoon
manga = manga
object = object
food = food
animal = animal
